<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1 id="homeLink" title="Back to overview">Bookmarks</h1>
  <span class="headerActions">
    <select id="categoryFilter" aria-label="Filter by category"></select>
    <span class="catActions">
      <button id="addCategory" title="Add category">+</button>
      <button id="renameCategory" title="Rename selected category">✎</button>
      <button id="delCategory" title="Delete selected category">−</button>
    </span>
    <button id="addBookmarkBtn" title="Add bookmark">+ Bookmark</button>
    <button id="importBtn" title="Import bookmarks.html">Import</button>
    <button id="clearAllBtn" title="Delete all categories and bookmarks" class="danger">Clear all</button>
    <button id="exportBtn" title="Export bookmarks.html">Export</button>
    <input id="importFile" type="file" accept=".html,.htm" hidden>
  </span>
</header>
<form id="addBookmarkForm" hidden>
  <div class="formRow">
    <label>Category
      <select id="bmCategory"></select>
    </label>
    <label>Title
      <input id="bmTitle" maxlength="500" required>
    </label>
  </div>
  <div class="formRow">
    <label>URL
      <input id="bmUrl" type="url" maxlength="2000" placeholder="https://…" required>
    </label>
  </div>
  <div class="formRow">
    <label>Description (optional)
      <input id="bmDesc" maxlength="2000">
    </label>
  </div>
  <div class="formRow">
    <button type="submit" id="bmSave">Save</button>
    <button type="button" id="bmCancel">Cancel</button>
    <span id="bmStatus" class="err"></span>
  </div>
</form>
</form>
<p id="hoverInfo"></p>
<main id="columns"></main>
<p id="empty" hidden>No bookmarks yet.</p>
<script src="/app.js"></script>
</body>
</html>
