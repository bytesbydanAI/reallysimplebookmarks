<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/1.4 system-ui, sans-serif; width: 300px; margin: 8px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  label { display: block; margin: 8px 0 2px; font-size: 12px; color: #555; }
  select, input, textarea {
    font: inherit; width: 100%; padding: 3px 4px;
    border: 1px solid #bbb; box-sizing: border-box;
  }
  textarea { resize: vertical; }
  #save { margin-top: 10px; padding: 4px 12px; width: auto; }
  #status { margin-top: 6px; font-size: 12px; color: #080; }
  #status.err { color: #c00; }
  #settings { display: none; margin-top: 10px; padding-top: 8px; border-top: 1px solid #ddd; }
  #settings.open { display: block; }
  #settingsBtn {
    border: none; background: none; padding: 2px 6px;
    font: inherit; font-size: 13px; color: #666;
    cursor: pointer; float: right; margin-top: 6px;
  }
  #settingsBtn:hover { color: #000; }
  #settingsActions { display: flex; gap: 6px; margin-top: 8px; }
  #settingsActions button { font: inherit; padding: 3px 10px; }
  #testResult { margin-top: 6px; font-size: 12px; white-space: pre-wrap; }
  #testResult.ok { color: #080; }
  #testResult.err { color: #c00; }
</style>
</head>
<body>
<h1>Add new bookmark</h1>
<label for="category">Category</label>
<select id="category"></select>
<input id="newCategory" placeholder="New category name" hidden>

<label for="title">Title</label>
<input id="title" maxlength="500">

<label for="url">URL</label>
<input id="url" type="url" maxlength="2000">

<label for="desc">Description (optional)</label>
<textarea id="desc" rows="2" maxlength="2000"></textarea>

<button id="save">Save</button>
<span id="status"></span>
<div style="clear: both;"></div>
<button id="settingsBtn" title="Settings">⚙</button>

<div id="settings">
  <label for="server">Server URL</label>
  <input id="server" type="url" placeholder="https://bookmarks.example.com">
  <div id="settingsActions">
    <button id="testConn">Test connection</button>
    <button id="saveServer">Save server</button>
  </div>
  <div id="testResult"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
